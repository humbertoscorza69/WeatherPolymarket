<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather MM — Trading Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #10151f;
    --panel-hi: #161d2b;
    --border: #1f2937;
    --text: #c9d1d9;
    --muted: #6b7280;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --amber: #f59e0b;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  header .tag { color: var(--muted); font-size: 11px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
  header .spacer { flex: 1; }
  header button { background: var(--panel-hi); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 11px; }
  header button:hover { background: var(--border); }
  main { padding: 24px; max-width: 1600px; margin: 0 auto; }
  .grid { display: grid; gap: 12px; }
  .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 24px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); padding: 14px 16px; border-radius: 8px; }
  .kpi .label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .kpi .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .kpi.pos .value { color: var(--green); }
  .kpi.neg .value { color: var(--red); }
  .kpi.warn .value { color: var(--amber); }
  .kpi.accent .value { color: var(--accent); }
  section { margin-bottom: 24px; }
  section h2 { margin: 0 0 12px 0; font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.1em; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-variant-numeric: tabular-nums; }
  th { background: var(--panel-hi); text-align: left; padding: 10px 12px; font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.08em; font-weight: 600; border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--panel-hi); }
  td.num { text-align: right; }
  td.pos { color: var(--green); }
  td.neg { color: var(--red); }
  .side-no { color: var(--accent); }
  .side-yes { color: var(--purple); }
  .empty { padding: 24px; text-align: center; color: var(--muted); font-style: italic; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; background: var(--panel-hi); color: var(--muted); border: 1px solid var(--border); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } }
  .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .chart-card .chart-title { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; font-weight: 600; }
  .chart-card canvas { max-height: 240px; }
  .chart-card.tall canvas { max-height: 320px; }
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .filter-bar input, .filter-bar select { background: var(--panel-hi); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font: inherit; font-size: 12px; }
  .filter-bar input::placeholder { color: var(--muted); }
  .filter-bar label { color: var(--muted); font-size: 11px; }
  .summary-bar { display: flex; gap: 16px; font-size: 11px; color: var(--muted); margin-top: 8px; padding: 8px 12px; background: var(--panel-hi); border-radius: 6px; }
  .summary-bar b { color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="dot" id="statusDot"></div>
  <h1>Weather MM · Paper Trading</h1>
  <span class="tag" id="lastUpdate">loading…</span>
  <div class="spacer"></div>
  <span class="tag" id="refreshCountdown">next refresh in —</span>
  <button onclick="refresh()">Refresh now</button>
</header>
<main>
  <div class="grid kpi-grid" id="kpis"></div>

  <section>
    <h2>Charts</h2>
    <div class="row2">
      <div class="chart-card tall">
        <div class="chart-title">Equity Curve (cumulative realized PnL)</div>
        <canvas id="equityChart"></canvas>
      </div>
      <div class="chart-card tall">
        <div class="chart-title">Rolling Win Rate (30-trade window)</div>
        <canvas id="rollingWrChart"></canvas>
      </div>
    </div>
    <div class="row2" style="margin-top: 12px;">
      <div class="chart-card">
        <div class="chart-title">Trade PnL Distribution</div>
        <canvas id="pnlHistChart"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">PnL by Side</div>
        <canvas id="sideChart"></canvas>
      </div>
    </div>
    <div class="row2" style="margin-top: 12px;">
      <div class="chart-card">
        <div class="chart-title">PnL by Signal Reason</div>
        <canvas id="reasonChart"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">PnL by City (top 15 by volume)</div>
        <canvas id="cityChart"></canvas>
      </div>
    </div>
  </section>

  <section>
    <h2>Open Positions <span id="openCount" class="pill">0</span></h2>
    <div id="openTable"></div>
  </section>

  <section>
    <h2>Closed Trades <span id="closedCount" class="pill">0</span></h2>
    <div class="filter-bar">
      <input type="text" id="filterText" placeholder="Search city, reason, status…" oninput="applyFilters()">
      <select id="filterSide" onchange="applyFilters()">
        <option value="">All sides</option>
        <option value="NO">NO only</option>
        <option value="YES">YES only</option>
      </select>
      <select id="filterResult" onchange="applyFilters()">
        <option value="">All results</option>
        <option value="win">Wins only</option>
        <option value="loss">Losses only</option>
      </select>
      <select id="filterLimit" onchange="applyFilters()">
        <option value="50">Last 50</option>
        <option value="200" selected>Last 200</option>
        <option value="1000">Last 1000</option>
        <option value="0">All</option>
      </select>
      <label style="margin-left: auto;">Sort:</label>
      <select id="filterSort" onchange="applyFilters()">
        <option value="closed-desc">Closed (newest)</option>
        <option value="closed-asc">Closed (oldest)</option>
        <option value="pnl-desc">PnL (highest)</option>
        <option value="pnl-asc">PnL (lowest)</option>
        <option value="hold-desc">Hold (longest)</option>
      </select>
    </div>
    <div id="closedTable"></div>
    <div class="summary-bar" id="filterSummary"></div>
  </section>
</main>

<script>
const REFRESH_MS = 10_000;
let lastTick = Date.now();
let tickTimer;

function fmt$(n, digits=2) { if (n == null || !Number.isFinite(n)) return "—"; const sign = n < 0 ? "-" : ""; return `${sign}$${Math.abs(n).toFixed(digits)}`; }
function fmtN(n, digits=2) { if (n == null || !Number.isFinite(n)) return "—"; return n.toFixed(digits); }
function fmtPct(n, digits=1) { if (n == null || !Number.isFinite(n)) return "—"; return `${(n*100).toFixed(digits)}%`; }
function fmtSigned(n, digits=2) { if (n == null || !Number.isFinite(n)) return "—"; return `${n>=0?"+":""}${n.toFixed(digits)}`; }
function fmtDur(min) {
  if (!Number.isFinite(min) || min <= 0) return "—";
  if (min < 60) return `${min.toFixed(0)}m`;
  if (min < 1440) return `${(min/60).toFixed(1)}h`;
  return `${(min/1440).toFixed(1)}d`;
}
function fmtTime(iso) { if (!iso) return "—"; const d = new Date(iso); return d.toLocaleTimeString([], { hour12: false }); }

function kpi(label, value, sub, cls="") {
  return `<div class="kpi ${cls}"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
}

function renderKpis(s) {
  const pnlCls = s.realizedPnl > 0 ? "pos" : (s.realizedPnl < 0 ? "neg" : "");
  const wrCls = s.winRate >= 0.8 ? "pos" : (s.winRate >= 0.5 ? "warn" : "neg");
  const pfCls = s.profitFactor >= 2 ? "pos" : (s.profitFactor >= 1 ? "warn" : "neg");
  document.getElementById("kpis").innerHTML = [
    kpi("Bankroll",     fmt$(s.bankroll), `${s.openPositions} open`, "accent"),
    kpi("Realized PnL", fmt$(s.realizedPnl), `${s.totalClosed} trades closed`, pnlCls),
    kpi("Win Rate",     fmtPct(s.winRate), `${s.wins}W / ${s.losses}L / ${s.flats}=`, wrCls),
    kpi("Profit Factor",fmtN(s.profitFactor), `${fmt$(s.grossWin)} / ${fmt$(s.grossLoss)}`, pfCls),
    kpi("Sharpe",       fmtN(s.sharpe, 2), `Sortino ${fmtN(s.sortino, 2)}`),
    kpi("Expectancy",   fmt$(s.expectancy), `per trade`),
    kpi("Payoff Ratio", fmtN(s.payoffRatio, 2), `avgW ${fmt$(s.avgWin)} / avgL ${fmt$(s.avgLoss)}`),
    kpi("Max Drawdown", fmt$(-Math.abs(s.maxDrawdown)), `Max runup ${fmt$(s.maxRunup)}`, s.maxDrawdown > 0 ? "neg" : ""),
    kpi("Largest Win",  fmt$(s.largestWin), `Largest loss ${fmt$(s.largestLoss)}`),
    kpi("Streak",       fmtSigned(s.currentStreak, 0), `max +${s.maxWinStreak} / -${s.maxLossStreak}`, s.currentStreak > 0 ? "pos" : (s.currentStreak < 0 ? "neg" : "")),
    kpi("Hold Time",    fmtDur(s.avgHoldMin), `median ${fmtDur(s.medianHoldMin)}`),
    kpi("Fill Rate",    fmtPct(s.fillRate), `${s.totalClosed}/${s.totalAttempts} attempts`),
  ].join("");
}

function renderOpen(positions) {
  document.getElementById("openCount").textContent = positions.length;
  if (!positions.length) {
    document.getElementById("openTable").innerHTML = `<div class="empty">No open positions.</div>`;
    return;
  }
  const rows = [...positions]
    .sort((a,b) => new Date(b.openedAt) - new Date(a.openedAt))
    .map(p => {
      const ageMin = (Date.now() - new Date(p.openedAt).getTime()) / 60000;
      const side = p.side === "NO" ? `<span class="side-no">NO</span>` : `<span class="side-yes">YES</span>`;
      return `<tr>
        <td>${fmtTime(p.openedAt)}</td>
        <td>${side}</td>
        <td>${p.city||""}</td>
        <td>${p.date||""}</td>
        <td class="num">${fmtN(p.entryPrice,4)}</td>
        <td class="num">${fmtN(p.shares,2)}</td>
        <td class="num">${fmt$(p.positionSize)}</td>
        <td class="num">${fmtN(p.cushion,1)}°C</td>
        <td><span class="pill">${p.reason||""}</span></td>
        <td class="num">${fmtDur(ageMin)}</td>
      </tr>`;
    }).join("");
  document.getElementById("openTable").innerHTML = `
    <table>
      <thead><tr>
        <th>Open</th><th>Side</th><th>City</th><th>Date</th>
        <th class="num">Entry</th><th class="num">Shares</th><th class="num">Size</th>
        <th class="num">Cushion</th><th>Reason</th><th class="num">Age</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

let __closedTrades = [];

function applyFilters() {
  const text = (document.getElementById("filterText").value || "").toLowerCase().trim();
  const side = document.getElementById("filterSide").value;
  const result = document.getElementById("filterResult").value;
  const limit = Number(document.getElementById("filterLimit").value);
  const sort = document.getElementById("filterSort").value;

  let rows = [...__closedTrades];
  if (side) rows = rows.filter(t => t.side === side);
  if (result === "win") rows = rows.filter(t => Number(t.pnl) > 0.01);
  if (result === "loss") rows = rows.filter(t => Number(t.pnl) < -0.01);
  if (text) {
    rows = rows.filter(t => {
      const s = `${t.city||""} ${t.reason||""} ${t.status||""} ${t.side||""}`.toLowerCase();
      return s.includes(text);
    });
  }

  const holdMin = (t) => (new Date(t.closedAt) - new Date(t.openedAt)) / 60000;
  if (sort === "closed-desc") rows.sort((a,b) => new Date(b.closedAt) - new Date(a.closedAt));
  else if (sort === "closed-asc") rows.sort((a,b) => new Date(a.closedAt) - new Date(b.closedAt));
  else if (sort === "pnl-desc") rows.sort((a,b) => Number(b.pnl) - Number(a.pnl));
  else if (sort === "pnl-asc") rows.sort((a,b) => Number(a.pnl) - Number(b.pnl));
  else if (sort === "hold-desc") rows.sort((a,b) => holdMin(b) - holdMin(a));

  const total = rows.length;
  if (limit > 0) rows = rows.slice(0, limit);

  // summary of filtered
  const wins = rows.filter(t => Number(t.pnl) > 0.01).length;
  const losses = rows.filter(t => Number(t.pnl) < -0.01).length;
  const sumPnl = rows.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
  const avgHold = rows.length ? rows.reduce((s, t) => s + holdMin(t), 0) / rows.length : 0;
  document.getElementById("filterSummary").innerHTML =
    `Showing <b>${rows.length}</b> / ${total} trades · ` +
    `WR <b>${total ? ((wins/rows.length)*100).toFixed(1) : "0.0"}%</b> (${wins}W / ${losses}L) · ` +
    `PnL <b>${fmt$(sumPnl)}</b> · avg hold <b>${fmtDur(avgHold)}</b>`;

  if (!rows.length) {
    document.getElementById("closedTable").innerHTML = `<div class="empty">No matching trades.</div>`;
    return;
  }

  const html = rows.map(t => {
    const pnl = Number(t.pnl)||0;
    const cls = pnl > 0.01 ? "pos" : (pnl < -0.01 ? "neg" : "");
    const side = t.side === "NO" ? `<span class="side-no">NO</span>` : `<span class="side-yes">YES</span>`;
    const hold = holdMin(t);
    return `<tr>
      <td>${fmtTime(t.closedAt)}</td>
      <td>${side}</td>
      <td>${t.city||""}</td>
      <td class="num">${fmtN(t.entryPrice,4)}</td>
      <td class="num">${fmtN(t.exitPrice,4)}</td>
      <td class="num">${fmtN(t.shares,2)}</td>
      <td class="num ${cls}">${fmt$(pnl)}</td>
      <td class="num">${fmtDur(hold)}</td>
      <td><span class="pill">${t.status||""}</span></td>
      <td><span class="pill">${t.reason||""}</span></td>
    </tr>`;
  }).join("");
  document.getElementById("closedTable").innerHTML = `
    <table>
      <thead><tr>
        <th>Closed</th><th>Side</th><th>City</th>
        <th class="num">Entry</th><th class="num">Exit</th><th class="num">Shares</th>
        <th class="num">PnL</th><th class="num">Hold</th><th>Status</th><th>Reason</th>
      </tr></thead>
      <tbody>${html}</tbody>
    </table>`;
}

function renderClosed(trades) {
  __closedTrades = trades || [];
  document.getElementById("closedCount").textContent = __closedTrades.length;
  applyFilters();
}

// ----- Charts -----
const CHART_COLORS = {
  accent: "#58a6ff", green: "#3fb950", red: "#f85149", amber: "#f59e0b",
  purple: "#a78bfa", muted: "#6b7280", grid: "rgba(255,255,255,0.05)",
};
const charts = {};

function baseOpts(extra = {}) {
  return {
    responsive: true, maintainAspectRatio: false,
    animation: { duration: 300 },
    plugins: {
      legend: { labels: { color: "#c9d1d9", font: { family: "ui-monospace", size: 11 } } },
      tooltip: { backgroundColor: "#161d2b", borderColor: "#1f2937", borderWidth: 1, titleColor: "#c9d1d9", bodyColor: "#c9d1d9", padding: 10 },
    },
    scales: {
      x: { ticks: { color: CHART_COLORS.muted, font: { family: "ui-monospace", size: 10 } }, grid: { color: CHART_COLORS.grid, drawBorder: false } },
      y: { ticks: { color: CHART_COLORS.muted, font: { family: "ui-monospace", size: 10 } }, grid: { color: CHART_COLORS.grid, drawBorder: false } },
    },
    ...extra,
  };
}

function upsertChart(id, type, data, opts) {
  if (charts[id]) {
    charts[id].data = data;
    charts[id].options = opts;
    charts[id].update("none");
    return;
  }
  const ctx = document.getElementById(id).getContext("2d");
  charts[id] = new Chart(ctx, { type, data, options: opts });
}

function renderEquity(curve) {
  const labels = curve.map((_, i) => i + 1);
  const data = curve.map(p => p.equity);
  const lastEq = data[data.length-1] || 0;
  const lineColor = lastEq >= 0 ? CHART_COLORS.green : CHART_COLORS.red;
  upsertChart("equityChart", "line", {
    labels,
    datasets: [{
      label: "Cumulative PnL ($)",
      data,
      borderColor: lineColor,
      backgroundColor: lineColor + "22",
      fill: true,
      tension: 0.2,
      pointRadius: 0,
      borderWidth: 2,
    }],
  }, baseOpts({
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `$${c.parsed.y.toFixed(2)}` } } },
    scales: {
      x: { title: { display: true, text: "trade #", color: CHART_COLORS.muted, font: { size: 10 } }, ticks: { color: CHART_COLORS.muted }, grid: { color: CHART_COLORS.grid } },
      y: { ticks: { color: CHART_COLORS.muted, callback: (v) => `$${v}` }, grid: { color: CHART_COLORS.grid } },
    },
  }));
}

function renderRollingWr(rolling) {
  const labels = rolling.map(r => r.idx);
  const data = rolling.map(r => r.wr * 100);
  upsertChart("rollingWrChart", "line", {
    labels,
    datasets: [{
      label: "Win rate (%)",
      data,
      borderColor: CHART_COLORS.accent,
      backgroundColor: CHART_COLORS.accent + "22",
      fill: true,
      tension: 0.2,
      pointRadius: 0,
      borderWidth: 2,
    }],
  }, baseOpts({
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${c.parsed.y.toFixed(1)}%` } } },
    scales: {
      x: { ticks: { color: CHART_COLORS.muted }, grid: { color: CHART_COLORS.grid } },
      y: { min: 0, max: 100, ticks: { color: CHART_COLORS.muted, callback: (v) => `${v}%` }, grid: { color: CHART_COLORS.grid } },
    },
  }));
}

function renderPnlHist(trades) {
  const pnls = trades.map(t => Number(t.pnl) || 0);
  if (!pnls.length) { if (charts.pnlHistChart) { charts.pnlHistChart.destroy(); delete charts.pnlHistChart; } return; }
  const min = Math.min(...pnls), max = Math.max(...pnls);
  const bins = 20;
  const width = (max - min) / bins || 1;
  const buckets = new Array(bins).fill(0);
  for (const p of pnls) {
    const i = Math.min(bins - 1, Math.max(0, Math.floor((p - min) / width)));
    buckets[i]++;
  }
  const labels = buckets.map((_, i) => `$${(min + i * width).toFixed(2)}`);
  const colors = buckets.map((_, i) => (min + (i + 0.5) * width) >= 0 ? CHART_COLORS.green : CHART_COLORS.red);
  upsertChart("pnlHistChart", "bar", {
    labels,
    datasets: [{ label: "trades", data: buckets, backgroundColor: colors, borderWidth: 0 }],
  }, baseOpts({
    plugins: { legend: { display: false } },
  }));
}

function renderBreakdown(canvasId, breakdown, opts = {}) {
  const entries = Object.entries(breakdown);
  if (!entries.length) { if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; } return; }
  const sorted = entries.sort((a, b) => b[1].n - a[1].n);
  const sliced = opts.topN ? sorted.slice(0, opts.topN) : sorted;
  const labels = sliced.map(([k]) => String(k));
  const pnl = sliced.map(([, v]) => v.pnl);
  const wr = sliced.map(([, v]) => v.n ? (v.w / v.n) * 100 : 0);
  const n = sliced.map(([, v]) => v.n);
  const colors = pnl.map(p => p >= 0 ? CHART_COLORS.green : CHART_COLORS.red);
  upsertChart(canvasId, "bar", {
    labels,
    datasets: [
      { label: "PnL ($)", data: pnl, backgroundColor: colors, borderWidth: 0, yAxisID: "y" },
      { label: "WR (%)", data: wr, type: "line", borderColor: CHART_COLORS.amber, backgroundColor: "transparent", yAxisID: "y1", pointRadius: 3, borderWidth: 2 },
    ],
  }, baseOpts({
    plugins: {
      legend: { labels: { color: "#c9d1d9", font: { size: 10 } } },
      tooltip: { callbacks: {
        label: (c) => {
          if (c.dataset.label === "PnL ($)") return `PnL: $${c.parsed.y.toFixed(2)}  (n=${n[c.dataIndex]})`;
          return `WR: ${c.parsed.y.toFixed(1)}%`;
        }
      } }
    },
    scales: {
      x: { ticks: { color: CHART_COLORS.muted, maxRotation: 45, minRotation: 0, font: { size: 10 } }, grid: { color: CHART_COLORS.grid } },
      y: { position: "left", ticks: { color: CHART_COLORS.muted, callback: (v) => `$${v}` }, grid: { color: CHART_COLORS.grid } },
      y1: { position: "right", min: 0, max: 100, ticks: { color: CHART_COLORS.amber, callback: (v) => `${v}%` }, grid: { display: false } },
    },
  }));
}

async function refresh() {
  try {
    const r = await fetch("/api/stats", { cache: "no-store" });
    if (!r.ok) throw new Error(r.statusText);
    const data = await r.json();
    renderKpis(data.summary);
    renderOpen(data.openPositions);
    renderClosed(data.closedTrades);
    renderEquity(data.equityCurve || []);
    renderRollingWr(data.rollingWR || []);
    renderPnlHist(data.closedTrades || []);
    renderBreakdown("sideChart",   data.breakdown?.bySide   || {});
    renderBreakdown("reasonChart", data.breakdown?.byReason || {});
    renderBreakdown("cityChart",   data.breakdown?.byCity   || {}, { topN: 15 });
    document.getElementById("lastUpdate").textContent = `updated ${new Date().toLocaleTimeString([], { hour12: false })}`;
    document.getElementById("statusDot").style.background = "var(--green)";
    lastTick = Date.now();
  } catch (e) {
    document.getElementById("lastUpdate").textContent = `error: ${e.message}`;
    document.getElementById("statusDot").style.background = "var(--red)";
  }
}

function tick() {
  const remaining = Math.max(0, REFRESH_MS - (Date.now() - lastTick));
  document.getElementById("refreshCountdown").textContent = `next refresh in ${Math.ceil(remaining/1000)}s`;
  if (remaining <= 0) refresh();
}

refresh();
setInterval(refresh, REFRESH_MS);
tickTimer = setInterval(tick, 500);
</script>
</body>
</html>
